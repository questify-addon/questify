<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Questify, capture bonus: tracker themes</title>
<link rel="stylesheet" href="../apercu.css">
<style>
  /* In-game captures (/qf demo theme, four times): captures/theme-*.png. */
  :root { --sans: "Avenir Next", "Avenir", "Inter", "Helvetica Neue", sans-serif; }
  .shot { position: absolute; display: block; border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 20px 56px rgba(0,0,0,.65); }
  .lbl { position: absolute; font-family: var(--sans); font-size: 17px; font-weight: 600; letter-spacing: .04em;
    color: #ead9a6; padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.62); }
</style>
</head>
<body>
<div class="stage">
  <div class="cap" style="width:600px">
    <div class="brand">Questify</div>
    <h1>Four tracker themes</h1>
    <p>Background, border and text colours change at once, from the options or with /qf theme.</p>
    <p>The background opacity is set separately (90% here); the text always stays sharp.</p>
  </div>
  <img class="shot" style="left:760px; top:110px; width:520px" src="captures/theme-parchment.png" alt="">
  <div class="lbl" style="left:760px; top:505px">Parchment (default)</div>
  <img class="shot" style="left:1320px; top:110px; width:520px" src="captures/theme-dark.png" alt="">
  <div class="lbl" style="left:1320px; top:505px">Black</div>
  <img class="shot" style="left:760px; top:570px; width:520px" src="captures/theme-transparent.png" alt="">
  <div class="lbl" style="left:760px; top:965px">Transparent</div>
  <img class="shot" style="left:1320px; top:570px; width:520px" src="captures/theme-gradient.png" alt="">
  <div class="lbl" style="left:1320px; top:965px">Grey fade</div>
  <div class="badge"><div class="t">In-game capture</div><div class="s">World of Warcraft: Forever</div></div>
</div>
</body>
</html>
