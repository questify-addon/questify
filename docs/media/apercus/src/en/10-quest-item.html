<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Questify, capture 10: quest item</title>
<link rel="stylesheet" href="../apercu.css">
<style>
  /* In-game capture (/qf demo questitem): captures/10-quest-item.png. */
  :root { --sans: "Avenir Next", "Avenir", "Inter", "Helvetica Neue", sans-serif; }
  .shot { position: absolute; display: block; border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 20px 56px rgba(0,0,0,.65); }
  .lbl { position: absolute; font-family: var(--sans); font-size: 17px; font-weight: 600; letter-spacing: .04em;
    color: #ead9a6; padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.62); }
</style>
</head>
<body>
<div class="stage">
  <div class="cap" style="width:600px">
    <div class="brand">Questify</div>
    <h1>The quest item to use</h1>
    <p>When the current step asks you to use an item, a button appears to the left of the tracker. Click it to use the item.</p>
    <p>You can also give it a key, in the options or in the game’s Key Bindings.</p>
  </div>
  <img class="shot" style="left:800px; top:250px; width:760px" src="captures/10-quest-item.png" alt="">
  <div class="lbl" style="left:800px; top:196px">The quest item button</div>
  <div class="badge"><div class="t">In-game capture</div><div class="s">World of Warcraft: Forever</div></div>
</div>
</body>
</html>
