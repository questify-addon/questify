<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Questify, direction artistique C</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css">
<script src="art-questify.js"></script>
<style>
/* Direction C « Questify » : bleu nuit, filets dorés fins, accent cyan. Jetons : */
.q {
  --bg: #0a1521; --bg2: #08111b; --panel: #0e1c2b; --card: #102235; --cardHi: #12304a; --inset: #071019;
  --edge: rgba(212,169,79,.50); --edgeSoft: rgba(212,169,79,.22); --line: rgba(130,200,235,.12); --line2: rgba(130,200,235,.16);
  --text: #eef3f7; --textDim: #b9c7d3; --textMuted: #8a9bab;
  --gold: #e2bd6a; --accent: #3fd0e6; --accentDeep: #1592b0; --onAccent: #04161d; --sel: rgba(63,208,230,.12);
  --quest: #ffd773; --npc: #94caff; --mob: #f57a7a; --item: #c7adff; --success: #4fd18b; --xp: #3fd0e6;
  font-family: var(--font); color: var(--text);
}
.q * { font-family: inherit; }
.gold { color: var(--gold); } .cy { color: var(--accent); }
.sc { text-transform: uppercase; letter-spacing: .1em; font-family: var(--clean) !important; font-weight: 600; }
.pnl { position: relative; background: radial-gradient(ellipse 80% 60% at 70% 0%, rgba(63,208,230,.07), transparent 70%), linear-gradient(180deg, var(--bg), var(--bg2));
  border: 1px solid var(--edge); box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 4px var(--edgeSoft), 0 12px 30px rgba(0,0,0,.55); }
.pnl .co { position: absolute; width: 18px; height: 18px; background-size: 100% 100%; background-image: var(--corner); z-index: 3; }
.pnl .co.tl { left: -2px; top: -2px; } .pnl .co.tr { right: -2px; top: -2px; transform: scaleX(-1); }
.pnl .co.bl { left: -2px; bottom: -2px; transform: scaleY(-1); } .pnl .co.br { right: -2px; bottom: -2px; transform: scale(-1,-1); }
.rule { height: 10px; background-size: 100% 100%; background-image: var(--rule); }
.logo { width: 34px; height: 34px; background-size: 100% 100%; background-image: var(--logo); flex: none; }
.rb { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--edge); display: grid; place-items: center; color: var(--textDim); background: rgba(255,255,255,.02); }
.rb svg { width: 12px; height: 12px; }
.crd { background: linear-gradient(180deg, var(--card), #0d1d2e); border: 1px solid var(--line2); position: relative; }
.crd.on { border-color: color-mix(in srgb, var(--accent) 70%, transparent); background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 14%, transparent), color-mix(in srgb, var(--accent) 3%, transparent) 70%), var(--card); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 18%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
.tile { width: 30px; height: 30px; flex: none; display: grid; place-items: center; position: relative; }
.tile::before { content: ""; position: absolute; inset: 5px; transform: rotate(45deg); border: 1px solid var(--edge); background: #0b1826; }
.tile .ic { position: relative; width: 14px; height: 14px; }
.tile img { position: relative; width: 26px; height: 26px; box-shadow: 0 0 0 1px var(--edge); }
.tile.img::before { display: none; }
.pb { position: relative; height: 4px; background: var(--inset); }
.pb b { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accentDeep), var(--accent)); box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 50%, transparent); }
.pb.ok b { background: linear-gradient(90deg, #22985b, var(--success)); box-shadow: none; }
.st { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--textMuted); flex: none; display: grid; place-items: center; }
.st.ok { border-color: var(--success); color: var(--success); } .st svg { width: 10px; height: 10px; }
.btnq { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; font-size: 13px; color: var(--gold); border: 1px solid var(--edge); background: rgba(212,169,79,.06); white-space: nowrap; }
.btnq.pri { color: var(--onAccent); background: linear-gradient(180deg, #6fe3f2, #26b4cf); border-color: #8ef0ff; font-weight: 600; }
.tog { width: 28px; height: 14px; border-radius: 7px; background: #24384c; position: relative; flex: none; }
.tog::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #8a9bab; }
.tog.on { background: var(--accentDeep); } .tog.on::after { left: 16px; background: #e8fbff; }
.cb { width: 13px; height: 13px; border: 1px solid var(--edge); background: var(--inset); display: grid; place-items: center; flex: none; }
.cb.on { background: var(--accent); border-color: var(--accent); color: var(--onAccent); } .cb svg { width: 9px; height: 9px; }
.sld { position: relative; height: 3px; background: #24384c; }
.sld b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.sld i { position: absolute; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px #0a1521; }
.sec { padding: 0 10px 8px; } .sec .h { display: flex; align-items: center; gap: 8px; height: 30px; border-bottom: 1px solid var(--line); margin: 0 -10px 6px; padding: 0 10px; }
.sec .h .ic { color: var(--gold); width: 14px; height: 14px; }
.opt { display: flex; align-items: center; gap: 8px; min-height: 22px; }
.opt .d { margin-left: auto; text-align: left; width: 52%; }
.sb .it { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 12px; font-size: 13px; color: var(--textDim); position: relative; }
.sb .it .ic { width: 14px; height: 14px; color: var(--gold); opacity: .8; }
.sb .it.on { color: var(--text); background: linear-gradient(90deg, rgba(63,208,230,.16), transparent); }
.sb .it.on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.lab2 { font-family: var(--clean); font-size: 15px; color: #8f98a5; margin: 0 0 10px; } .lab2 b { color: #e3e7ec; }
.mtn { height: 80px; }
</style>
</head>
<body>
<div class="bar-ctl"><div class="grp"><span class="lbl">Police</span><button id="fg">Du jeu</button><button id="fc">Inter</button></div></div>
<div class="page" id="page"></div>
<script>
const IC = (n) => `https://wow.zamimg.com/images/wow/icons/large/${n}.jpg`;
const G = {
  accept: '<svg viewBox="0 0 16 16"><rect x="6.6" y="1.5" width="2.8" height="9" rx="1.2" fill="currentColor"/><circle cx="8" cy="13.4" r="1.6" fill="currentColor"/></svg>',
  turnin: '<svg viewBox="0 0 16 16"><path d="M4.6 5.4C4.6 3.3 6.1 2 8.1 2c2.1 0 3.5 1.3 3.5 3.1 0 1.5-.9 2.3-1.9 2.9-.8.5-1 .8-1 1.6v.6H6.6v-.8c0-1.3.5-2 1.5-2.6.8-.5 1.2-.8 1.2-1.5S8.8 4.2 8 4.2c-.8 0-1.3.5-1.4 1.3z" fill="currentColor"/><circle cx="7.7" cy="13.4" r="1.6" fill="currentColor"/></svg>',
  skull: '<svg viewBox="0 0 16 16"><path d="M8 1.8c-3.3 0-5.6 2.2-5.6 5.2 0 1.8.9 3.2 2.2 4v2.2h1.6v-1.4h1v1.4h1.6v-1.4h1v1.4h1.6V11c1.3-.8 2.2-2.2 2.2-4 0-3-2.3-5.2-5.6-5.2zM5.6 9.2a1.4 1.4 0 110-2.8 1.4 1.4 0 010 2.8zm4.8 0a1.4 1.4 0 110-2.8 1.4 1.4 0 010 2.8z" fill="currentColor"/></svg>',
  done: '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x: '<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5"/></svg>',
  gear: '<svg viewBox="0 0 16 16"><path d="M8 5.2a2.8 2.8 0 100 5.6 2.8 2.8 0 000-5.6zm6 3.6V7.2l-1.7-.4-.5-1.2.9-1.5-1.1-1.1-1.5.9-1.2-.5L8.8 1.7H7.2l-.4 1.7-1.2.5-1.5-.9L3 4.1l.9 1.5-.5 1.2-1.7.4v1.6l1.7.4.5 1.2-.9 1.5L4.1 13l1.5-.9 1.2.5.4 1.7h1.6l.4-1.7 1.2-.5 1.5.9 1.1-1.1-.9-1.5.5-1.2z" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>',
  route: '<svg viewBox="0 0 16 16"><path d="M3 13c0-4 10-2 10-6 0-2-2-3-4-3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="3" cy="13" r="1.8" fill="currentColor"/><path d="M9 1.5l-2.5 2.5L9 6.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  nav: '<svg viewBox="0 0 16 16"><path d="M2 8l12-6-5 12-1.5-4.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  auto: '<svg viewBox="0 0 16 16"><path d="M9 1L3 9h4.5L6.5 15 13 7H8.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  bag: '<svg viewBox="0 0 16 16"><path d="M3 6h10l-1 8H4zM6 6V4.5a2 2 0 014 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  shield: '<svg viewBox="0 0 16 16"><path d="M8 1.5l5.5 2v4c0 3.5-2.5 5.8-5.5 7-3-1.2-5.5-3.5-5.5-7v-4z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  map: '<svg viewBox="0 0 16 16"><path d="M1.5 3.5l4-1.5 5 2 4-1.5v10l-4 1.5-5-2-4 1.5zM5.5 2v10M10.5 4v10" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  list: '<svg viewBox="0 0 16 16"><path d="M5 4h9M5 8h9M5 12h9" stroke="currentColor" stroke-width="1.4"/><circle cx="2" cy="4" r="1" fill="currentColor"/><circle cx="2" cy="8" r="1" fill="currentColor"/><circle cx="2" cy="12" r="1" fill="currentColor"/></svg>',
  palette: '<svg viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 100 13c1 0 1.4-.8 1-1.6-.5-1 .2-2 1.3-2h1.7a2.5 2.5 0 002.5-2.5C14.5 4.4 11.6 1.5 8 1.5z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5" cy="7" r="1" fill="currentColor"/><circle cx="8" cy="4.5" r="1" fill="currentColor"/><circle cx="11" cy="6" r="1" fill="currentColor"/></svg>',
  user: '<svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 14.5c.5-3 2.7-4.5 5.5-4.5s5 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  tool: '<svg viewBox="0 0 16 16"><path d="M10.5 1.5a3.5 3.5 0 00-3.3 4.6L1.8 11.5l2.7 2.7 5.4-5.4a3.5 3.5 0 004.6-3.3l-2 2-2-.5-.5-2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  chev: '<svg viewBox="0 0 12 12"><path d="M3 7.5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  pin: '<svg viewBox="0 0 16 16"><path d="M8 15s5-5 5-8.5a5 5 0 00-10 0C3 10 8 15 8 15z" fill="currentColor"/><circle cx="8" cy="6.5" r="1.8" fill="#0a1521"/></svg>',
};
const art = Object.entries(ART_Q).map(([k, v]) => `--${k}:url('${v}')`).join(";");
const co = `<span class="co tl"></span><span class="co tr"></span><span class="co bl"></span><span class="co br"></span>`;
const g = (k, c = "") => `<span class="ic ${c}">${G[k]}</span>`;

function guide() {
  const steps = [
    ["done", "accept", "Prendre : La caverne des trolls", "Auprès de <span class='c-npc'>Senir Whitebeard</span>", 100],
    ["on", "kill", "Faire : La caverne des trolls", "Jeune troll Frostmane tué : 5/14", 36],
    ["", "turnin", "Rendre : La caverne des trolls", "À <span class='c-npc'>Senir Whitebeard</span>, Brewnall", 0],
    ["", "accept", "Prendre : Le journal volé", "Auprès de <span class='c-npc'>Grelin Whitebeard</span>", 0],
    ["", "accept", "Prendre : Une livraison de thé brûlant", "Auprès de <span class='c-npc'>Felix Whindlebolt</span>", 0],
  ];
  const card = ([s, k, t, d, p], i) => `<div class="crd ${s === "on" ? "on" : ""}" style="display:flex;align-items:center;gap:10px;padding:7px 10px;margin-bottom:5px">
      ${k === "kill" ? `<span class="tile img"><img src="${IC("inv_sword_04")}" alt=""></span>` : `<span class="tile">${g(k, "c-quest")}</span>`}
      <div style="flex:1;min-width:0">
        <div class="s13 ${s === "done" ? "tm" : ""}"><span class="tm num">${11 + i - 1}.</span> ${t.replace(/: (.*)$/, ': <span class="' + (s === "done" ? "" : "c-quest") + '">$1</span>')}</div>
        <div class="s12 ${s === "on" ? "cy" : "tm"}" style="margin-top:1px">${d}</div>
        ${p ? `<div style="display:flex;align-items:center;gap:8px;margin-top:4px"><div class="pb ${p === 100 ? "ok" : ""}" style="flex:1"><b style="width:${p}%"></b></div><span class="s11 tm num nw" style="width:34px;text-align:right">${p} %</span></div>` : ""}
      </div>
      <span class="st ${s === "done" ? "ok" : ""}">${s === "done" ? G.done : ""}</span></div>`;
  return `<div class="q pnl" style="width:760px;${art}">${co}
  <div style="display:flex;align-items:center;gap:12px;padding:14px 16px 8px">
    <span class="logo" style="width:40px;height:40px"></span>
    <div style="border-left:1px solid var(--edgeSoft);padding-left:12px"><div style="font-size:21px;line-height:24px"><span class="gold">Questify</span> <span class="t">Guide</span></div><div class="s12 cy">Alliance · Nain · niveau 3</div></div>
    <div style="margin-left:24px;display:flex;gap:18px" class="s13"><span class="t" style="box-shadow:inset 0 -2px 0 var(--accent);padding:5px 0">Route</span><span class="td" style="padding:5px 0">Quêtes de classe</span><span class="td" style="padding:5px 0">Donjons</span></div>
    <span style="flex:1"></span><span class="rb">${G.gear}</span><span class="rb">${G.x}</span></div>
  <div class="rule" style="margin:0 16px"></div>
  <div style="display:flex;gap:14px;padding:10px 16px 12px">
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:baseline;margin-bottom:2px"><span class="s12 sc gold">Étapes du chapitre</span>
        <span class="crd s12" style="margin-left:auto;padding:2px 8px;display:flex;gap:6px;align-items:center">Coldridge Valley <span class="tm">1-6</span><span class="ic tm" style="width:10px;height:10px;transform:rotate(180deg)">${G.chev}</span></span></div>
      <div class="s11 tm" style="margin-bottom:8px">11 étapes faites sur 40 · 3 chapitres d'avance sur le niveau</div>
      ${steps.map(card).join("")}
    </div>
    <div class="crd" style="width:220px;padding:10px 12px;background:linear-gradient(180deg,#0e2030,#0a1724)">
      <div class="s12 sc gold">◆ Progression</div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:12px"><span class="rb" style="width:34px;height:34px;color:var(--accent);font:700 11px var(--clean)">XP</span>
        <div><div class="s12 td">XP par heure</div><div class="cy" style="font-size:19px;line-height:22px;font-weight:600">11 840 XP/h</div><div class="s11 tm">~3,5k XP restants au chapitre</div></div></div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:12px"><span class="rb" style="width:34px;height:34px;color:var(--accent)">${G.route}</span>
        <div><div class="s12 td">Niveau suivant</div><div class="cy" style="font-size:19px;line-height:22px;font-weight:600">4 min</div><div class="s11 tm">au rythme actuel</div></div></div>
      <svg class="mtn" viewBox="0 0 200 80" style="width:100%;margin-top:14px"><g fill="none" stroke="#d4a94f" stroke-width="1" opacity=".75">
        <path d="M0 78L40 40 58 52 92 12 120 46 136 34 170 62 200 50"/><path d="M92 12l-6 22 10 10-4 18M40 40l6 18-8 12M136 34l-2 14 8 10"/><path d="M0 78h200" opacity=".5"/></g>
        <path d="M14 76c30-10 50 2 76-14 20-12 36-6 52-20" fill="none" stroke="#3fd0e6" stroke-width="1.6" stroke-dasharray="3 3"/></svg>
      <div class="s12 td" style="text-align:center;margin-top:6px">Reste sur la route.</div><div class="s12 cy" style="text-align:center">Questify s'occupe du reste.</div>
    </div>
  </div>
  <div class="rule" style="margin:0 16px"></div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 16px 14px"><span class="tog on"></span><div><div class="s13">Suivi affiché</div><div class="s11 tm">Étape en cours et suivantes sous la minicarte</div></div>
    <span style="flex:1"></span><span class="btnq">${g("gear")}Options du guide</span></div></div>`;
}

function tracker(acc) {
  const style = acc ? `--accent:${acc[0]};--accentDeep:${acc[1]};--gold:${acc[2]};--edge:${acc[3]};--edgeSoft:${acc[3].replace(/[\d.]+\)$/, ".22)")}` : "";
  return `<div class="q pnl" style="width:290px;${art};${style}">${co}
  ${acc && acc[4] ? `<img src="${acc[4]}" style="position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 1px var(--edge)">` : ""}
  <div style="padding:12px 14px 10px">
    <div style="display:flex;align-items:center;gap:8px">${acc && acc[4] ? "" : `<span class="logo" style="width:26px;height:26px"></span>`}<div style="flex:1;min-width:0"><div class="s15 gold">Coldridge Valley</div><div class="s11 tm">Niveaux 1-6 · 12/40 étapes</div></div></div>
    <div class="pb" style="margin:8px 0 4px"><b style="width:30%"></b></div>
    <div class="s11" style="display:flex"><span class="td num">~3,5k XP restants</span><span class="cy num" style="margin-left:auto">11,8k XP/h · niv. 4 min</span></div>
    <div class="rule" style="margin:8px 0"></div>
    <div class="crd on" style="display:flex;gap:9px;padding:7px 8px">
      <span class="tile img"><img src="${IC("inv_sword_04")}" alt=""></span>
      <div style="flex:1;min-width:0">
        <div class="s13"><span class="tm">Faire</span> <span class="c-quest semi">La caverne des trolls</span></div>
        <div class="s13" style="display:flex;margin-top:2px"><span>Jeune troll Frostmane tué</span><span class="num semi" style="margin-left:auto">5/14</span></div>
        <div class="pb" style="margin-top:4px"><b style="width:36%"></b></div>
        <div class="s12" style="display:flex;align-items:center;gap:5px;margin-top:4px">${g("skull", "c-mob")}<span class="c-mob">Jeune troll Frostmane</span><span class="tm num" style="margin-left:auto">142 yd</span></div>
      </div></div>
    ${[["turnin", "Rendre", "La caverne des trolls"], ["accept", "Prendre", "Le journal volé"], ["accept", "Prendre", "Une livraison de thé brûlant"]].map(([k, v, n]) =>
      `<div style="display:flex;align-items:center;gap:7px;height:21px;margin-top:2px;padding:0 4px">${g(k, "c-quest")}<span class="s12 tm">${v}</span><span class="s12 td ell">${n}</span></div>`).join("")}
  </div></div>`;
}

function options() {
  const side = [["route", "Route", 1], ["nav", "Navigation"], ["auto", "Automatisation"], ["bag", "Butin"], ["shield", "Classe et donjons"], ["map", "Carte et repères"], ["list", "Suivi"], ["palette", "Thème"], ["tool", "Confort"], ["user", "Profils"]];
  const chk = (on, t, d) => `<div class="opt s13"><span class="cb ${on ? "on" : ""}">${on ? G.done : ""}</span><span>${t}</span><span class="d s12 tm">${d}</span></div>`;
  return `<div class="q pnl" style="width:820px;${art}">${co}
  <div style="display:flex;align-items:center;gap:12px;padding:12px 16px 10px">
    <span class="logo" style="width:40px;height:40px"></span>
    <div><div class="gold" style="font-size:21px;line-height:24px">Questify</div><div class="s12 cy">Options de l'addon</div></div>
    <span style="flex:1"></span><span class="crd s12 tm" style="padding:5px 10px;width:200px">⌕ Chercher une option</span><span class="btnq">↺ Valeurs par défaut</span><span class="rb">${G.x}</span></div>
  <div style="display:flex;border-top:1px solid var(--edgeSoft)">
    <div class="sb" style="width:170px;padding:8px 0;border-right:1px solid var(--line);display:flex;flex-direction:column">
      ${side.map(([i, n, on]) => `<div class="it ${on ? "on" : ""}">${g(i)}${n}</div>`).join("")}
      <div style="margin-top:auto;padding:12px;display:flex;gap:8px;align-items:center"><span class="logo" style="width:22px;height:22px"></span><div><div class="s12 gold">Questify 0.8.1</div><div class="s11 cy">Prêt pour l'aventure</div></div></div>
    </div>
    <div style="flex:1;padding:12px 14px">
      <div style="display:flex;align-items:center;gap:8px"><span class="ic gold" style="width:16px;height:16px">${G.route}</span><span style="font-size:17px">Route</span></div>
      <div class="s12 tm" style="margin:2px 0 10px">Comment le guide choisit et montre les étapes.</div>
      <div class="crd sec"><div class="h">${g("list")}<span class="s13 semi">Étapes du guide</span><span class="ic tm" style="margin-left:auto;width:10px;height:10px">${G.chev}</span></div>
        ${chk(1, "Niveau des quêtes", "Montre le niveau à côté du nom des quêtes.")}
        ${chk(1, "Quêtes de classe", "Ajoute les suites de classe à la route.")}
        ${chk(0, "Étapes faites", "Garde les étapes faites dans le journal.")}
        ${chk(1, "Mode compact", "Serre les lignes du suivi.")}</div>
      <div class="crd sec" style="margin-top:8px"><div class="h">${g("map")}<span class="s13 semi">Détours et filtres</span><span class="ic tm" style="margin-left:auto;width:10px;height:10px">${G.chev}</span></div>
        <div class="opt s13"><span style="width:200px">Ignorer les quêtes grises</span><div class="sld" style="flex:1"><b style="width:62%"></b><i style="left:60%"></i></div><span class="s12 t num" style="width:40px;text-align:right">−5</span></div>
        <div class="opt s13" style="margin-top:4px"><span style="width:200px">Seulement les quêtes utiles</span><span class="s12 tm" style="flex:1">Retire les quêtes sans XP ni récompense.</span><span class="tog on"></span></div></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <div class="crd sec" style="flex:1"><div class="h">${g("nav")}<span class="s13 semi">Flèche</span></div>${chk(1, "Afficher", "")}${chk(1, "Distance", "")}
          <div class="s12 td" style="margin-top:4px">Taille</div><div style="display:flex;gap:8px;align-items:center"><div class="sld" style="flex:1"><b style="width:55%"></b><i style="left:52%"></i></div><span class="s12 num">120 %</span></div></div>
        <div class="crd sec" style="flex:1"><div class="h">${g("auto")}<span class="s13 semi">Automatisation</span></div>${chk(1, "Prendre les quêtes", "")}${chk(1, "Rendre les quêtes", "")}${chk(0, "Passer les cinématiques", "")}
          <div class="s11 c-warn" style="margin-top:4px">⚠ Maj enfoncée : rien d'automatique.</div></div>
        <div class="crd sec" style="flex:1"><div class="h">${g("palette")}<span class="s13 semi">Thème</span></div>
          <div class="s12 td">Couleurs</div><div class="crd s12" style="padding:3px 8px;margin:3px 0 6px;display:flex">◆ <span class="cy" style="margin-left:4px">Questify</span><span class="tm" style="margin-left:auto">▾</span></div>
          <div class="opt s12"><span>Suivre ma race</span><span class="tog on" style="margin-left:auto"></span></div></div>
      </div>
    </div></div>
  <div style="display:flex;align-items:center;padding:8px 16px;border-top:1px solid var(--edgeSoft)" class="s12"><span class="tm">Les réglages s'appliquent tout de suite.</span><span style="flex:1"></span><span class="gold">◆ Questify</span></div></div>`;
}

function badge() {
  return `<div class="q" style="position:relative;width:200px;height:220px;${art}">
    <div style="position:absolute;inset:0;background-size:100% 100%;background-image:var(--badge);filter:drop-shadow(0 0 14px rgba(63,208,230,.35))"></div>
    <svg viewBox="0 0 100 60" style="position:absolute;left:46px;top:46px;width:108px;height:64px;filter:drop-shadow(0 0 6px #3fd0e6)">
      <path d="M8 22h46V8l38 22-38 22V38H8z" fill="#5fe6f7" stroke="#e8fdff" stroke-width="2" stroke-linejoin="round"/><path d="M8 30h80" stroke="#c8f8ff" stroke-width="1" opacity=".6"/></svg>
    <div class="gold" style="position:absolute;left:0;right:0;top:122px;text-align:center;font-size:15px;letter-spacing:.2em">QUESTIFY</div>
    <div class="s13" style="position:absolute;left:0;right:0;top:146px;display:flex;justify-content:center;gap:8px;align-items:center">
      <span class="ic cy" style="width:13px;height:13px">${G.pin}</span><span class="num">128 yd</span><span class="tm">|</span><span class="num">11/40</span><span class="s11 sc tm">étape</span></div>
  </div>`;
}

function icons() {
  const im = (s) => `<div style="width:${s}px;height:${s}px;background-size:100% 100%;background-image:var(--icon)"></div>`;
  return `<div class="q" style="${art};display:flex;gap:26px;align-items:flex-end">
    ${im(200)}${im(64)}${im(40)}${im(32)}
    <div style="padding:8px;background:#c9d3dd;display:flex;gap:12px;align-items:flex-end">${im(64)}${im(32)}</div></div>`;
}

function render() {
  const acc = [
    ["Alliance", ["#5e9bff", "#2b5fc4", "#e3c06a", "rgba(212,169,79,.55)", IC("inv_misc_tournaments_symbol_human")]],
    ["Horde", ["#ff5a4a", "#b3261c", "#d9a35a", "rgba(200,120,80,.55)", IC("inv_misc_tournaments_symbol_orc")]],
    ["Nain", ["#ff9a4a", "#b85a1c", "#e2bd6a", "rgba(212,169,79,.55)", IC("inv_misc_tournaments_symbol_dwarf")]],
    ["Elfe de la nuit", ["#b896ff", "#6a44c8", "#cfd6e6", "rgba(190,200,230,.5)", IC("inv_misc_tournaments_symbol_nightelf")]],
  ];
  document.getElementById("page").innerHTML = `
<div class="head-cap"><div><div class="brand">Questify · direction artistique C</div><h1>Bleu nuit, filets dorés, accent cyan</h1>
<div class="meta">D'après tes références : panneaux propres et modernes, coins dorés fins, cartes d'étapes, accent lumineux. Les factions et races gardent ce cadre et changent l'accent, le blason et la teinte des filets (en bas).</div></div></div>
<div class="row">
  <div class="cell"><div class="lab2"><b>Journal</b> (guide + étapes) · zoom 1,4</div><div style="zoom:1.4">${guide()}</div></div>
  <div class="cell"><div class="lab2"><b>Nouvelle icône</b> : 200, 64, 40, 32 px, puis sur fond clair</div>${icons()}
    <div class="lab2" style="margin-top:30px"><b>Badge de la flèche</b> (idée, à voir avec la navigation) · zoom 1,3</div><div style="zoom:1.3">${badge()}</div></div>
</div>
<div class="row">
  <div class="cell"><div class="lab2"><b>Options</b> en cartes · zoom 1,3</div><div style="zoom:1.3">${options()}</div></div>
  <div class="cell"><div class="lab2"><b>Suivi</b> sur le monde · zoom 1,5</div><div class="world" style="padding:24px"><div style="zoom:1.5">${tracker()}</div></div></div>
</div>
<div class="lab2"><b>Même cadre, accent et blason par faction ou race</b> · zoom 1,25</div>
<div class="world" style="padding:24px;display:flex;gap:22px">${acc.map(([n, a]) => `<div><div style="zoom:1.25">${tracker(a)}</div><div style="font:600 16px var(--clean);color:#fff;margin-top:8px;text-shadow:0 1px 2px #000">${n}</div></div>`).join("")}</div>`;
}
const P = new URLSearchParams(location.search);
if (P.get("shot")) document.body.classList.add("shot");
if (P.get("font") === "clean") document.body.classList.add("f-clean");
document.getElementById("fg").onclick = () => document.body.classList.remove("f-clean");
document.getElementById("fc").onclick = () => document.body.classList.add("f-clean");
render();
</script>
</body>
</html>
