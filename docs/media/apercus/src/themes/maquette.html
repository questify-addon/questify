<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Questify, maquette des thèmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css">
<script src="tokens.js"></script>
<script src="art-alliance.js"></script>
<script src="art-questify.js"></script>
<script src="art-banners.js"></script>
</head>
<body>
<!-- Paramètres d'URL : ?theme=neutral&font=game|clean&icons=flat|game&style=solid|fade|none&view=windows|grid&shot=1 -->
<div class="bar-ctl" id="ctl"></div>
<div class="page" id="page"></div>

<script>
const P = new URLSearchParams(location.search);
const state = {
  theme: P.get("theme") || "neutral",
  font: P.get("font") || "game",
  icons: P.get("icons") || "flat",
  style: P.get("style") || "solid",
  view: P.get("view") || "windows",
};
if (P.get("shot")) document.body.classList.add("shot");

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function mix(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const c = [16, 8, 0].map((sh) => Math.round(((pa >> sh) & 255) * (1 - k) + ((pb >> sh) & 255) * k));
  return "#" + c.map((x) => x.toString(16).padStart(2, "0")).join("");
}
function keyOf(t) { return Object.keys(THEMES).find((k) => THEMES[k] === t); }
function banner(t) {
  return bannerSVG(keyOf(t), { far: mix(t.bg, "#000000", 0.05), near: mix(t.bg, "#000000", 0.3), glow: t.trim === t.accent ? t.metal : t.trim });
}
function crestSrc(t) { return t.emblem === "logo" ? ART_Q.logo : t.emblem; }
/* bandeau illustré : fondu du ciel, étoiles, silhouette, puis le contenu par-dessus */
function bandeau(t, h, inner) {
  return `<div class="bnr" style="height:${h}px"><div class="bsky"></div><div class="bimg" style="background-image:url('${banner(t)}')"></div><div class="bin">${inner}</div></div>`;
}
const CORNERS = `<span class="co tl"></span><span class="co tr"></span><span class="co bl"></span><span class="co br"></span>`;
function vars(t) {
  const out = { ...SHARED, ...t, sel: rgba(t.accent, 0.16), line2: "rgba(255,255,255,.13)" };
  return Object.entries(out).filter(([k]) => !["name", "group", "note", "emblem", "emblemF"].includes(k))
    .concat([["corner", `url('${ART_ALLIANCE.corner}')`], ["ring", `url('${ART_ALLIANCE.ring}')`]])
    .map(([k, v]) => `--${k}:${v}`).join(";");
}

/* ------------------------------------------------------------ icônes plates (SVG, couleur du texte) */
const SV = {
  accept: '<svg viewBox="0 0 16 16"><rect x="6.6" y="1.5" width="2.8" height="9" rx="1.2" fill="currentColor"/><circle cx="8" cy="13.4" r="1.6" fill="currentColor"/></svg>',
  turnin: '<svg viewBox="0 0 16 16"><path d="M4.6 5.4C4.6 3.3 6.1 2 8.1 2c2.1 0 3.5 1.3 3.5 3.1 0 1.5-.9 2.3-1.9 2.9-.8.5-1 .8-1 1.6v.6H6.6v-.8c0-1.3.5-2 1.5-2.6.8-.5 1.2-.8 1.2-1.5S8.8 4.2 8 4.2c-.8 0-1.3.5-1.4 1.3z" fill="currentColor"/><circle cx="7.7" cy="13.4" r="1.6" fill="currentColor"/></svg>',
  kill: '<svg viewBox="0 0 16 16"><path d="M13.6 1.6l-.5 3L6.4 11.3 4.7 9.6l6.7-6.7zM3.2 9.4l3.4 3.4-1 1-1.2-1.2-1.6 1.6-1-1 1.6-1.6-1.2-1.2z" fill="currentColor"/></svg>',
  skull: '<svg viewBox="0 0 16 16"><path d="M8 1.8c-3.3 0-5.6 2.2-5.6 5.2 0 1.8.9 3.2 2.2 4v2.2h1.6v-1.4h1v1.4h1.6v-1.4h1v1.4h1.6V11c1.3-.8 2.2-2.2 2.2-4 0-3-2.3-5.2-5.6-5.2zM5.6 9.2a1.4 1.4 0 110-2.8 1.4 1.4 0 010 2.8zm4.8 0a1.4 1.4 0 110-2.8 1.4 1.4 0 010 2.8z" fill="currentColor"/></svg>',
  done: '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  cur: '<svg viewBox="0 0 16 16"><path d="M5 3l7 5-7 5z" fill="currentColor"/></svg>',
  x: '<svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6"/></svg>',
  search: '<svg viewBox="0 0 12 12"><circle cx="5" cy="5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7.7 7.7L11 11" stroke="currentColor" stroke-width="1.3"/></svg>',
  check: '<svg viewBox="0 0 10 10"><path d="M1.5 5.2l2.3 2.3L8.5 2.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  chev: '<svg viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
};
/* icône d'étape : plate (couleur de sens) ou celle du jeu */
function ic(kind, cls) {
  const g = { accept: "g-accept", turnin: "g-turnin", kill: "g-kill", done: "g-done" }[kind];
  const col = cls || { accept: "c-quest", turnin: "c-quest", kill: "c-mob", done: "c-ok", skull: "c-mob", cur: "ta" }[kind] || "";
  const flat = `<span class="ic flat ${col}">${SV[kind]}</span>`;
  return g ? flat + `<span class="gameic ${g}"></span>` : `<span class="ic ${col}">${SV[kind]}</span>`;
}
function emb(t, size) {
  size = size || 32;
  return `<span class="emb" style="width:${size}px;height:${size}px"><span class="disc"><img src="${crestSrc(t)}" alt=""></span><span class="rg"></span></span>`;
}
function hd(t, title, extra = "") {
  return bandeau(t, 52, `${emb(t, 34)}<span class="ttl">${title}</span>${extra}<span class="sp"></span><span class="x">${SV.x}</span>`);
}

/* ------------------------------------------------------------ suivi */
/* scènes : kill (monstres à tuer), zone (plusieurs quêtes au même endroit), item (objet à utiliser) */
const SCENES = {
  kill: { zone: "Coldridge Valley", lv: "1-6", sub: "Dun Morogh · 12/40 étapes", pct: 30, xp: "~3,5k XP restants", rate: "11,8k XP/h · niveau dans 4 min" },
  zone: { zone: "Coldridge Valley", lv: "1-6", sub: "Dun Morogh · 20/40 étapes", pct: 50, xp: "~2,9k XP restants", rate: "12,6k XP/h · niveau dans 3 min" },
  item: { zone: "Darkshore", lv: "16-19", sub: "Sombrivage · 33/119 étapes", pct: 28, xp: "~37,3k XP restants", rate: "22,8k XP/h · niveau dans 26 min" },
};
const ZI = (n) => `https://wow.zamimg.com/images/wow/icons/large/${n}.jpg`;
function trackerBody(scene) {
  if (scene === "zone") return `
    <div class="cur">
      <div class="ico"><span class="zonedot"></span><div class="s11 td num nw" style="margin-top:4px">38 yd</div></div>
      <div class="body">
        <div class="s13"><span class="verb" style="background:var(--zone)">Zone</span><span class="c-zone semi">Vallée des Frigères</span></div>
        <div class="s11 td">5 objectifs · 3 quêtes, une seule visite</div>
        <div class="grp s11 tm">Objets</div>
        <div class="obj s12"><span class="t">Seau de boulons de Felix</span><span class="t num semi" style="margin-left:auto">0/1</span></div>
        <div class="obj s12"><span class="t">Coffre de Felix</span><span class="t num semi" style="margin-left:auto">0/1</span></div>
        <div class="grp s11 tm">Élites et nommés</div>
        <div class="mob s12">${ic("skull")}<span class="c-mob">Grik'nir le Froid</span><span class="r tm num">niv. 5</span></div>
        <div class="obj s12" style="padding-left:21px"><span class="t">Journal de Grelin Whitebeard</span><span class="t num semi" style="margin-left:auto">0/1</span></div>
        <div class="grp s11 tm">Monstres</div>
        <div class="mob s12">${ic("skull")}<span class="c-mob">Trogg Mâcheroc</span><span class="r t num semi">2/6</span></div>
        <div class="mob s12">${ic("skull")}<span class="c-mob">Trogg Mâcheroc forcené</span><span class="r t num semi">1/6</span></div>
      </div>
    </div>
    <div class="nxt s12">
      <div class="l">${ic("kill")}<span class="td ell">Les malheurs d'un réfugié</span></div>
      <div class="l">${ic("turnin")}<span class="tm">Rendre</span><span class="td ell">Rapporter la Tasse</span></div>
      <div class="l">${ic("turnin")}<span class="tm">Rendre</span><span class="td ell">Le journal volé</span></div>
    </div>`;
  if (scene === "item") return `
    <div class="cur">
      <div class="ico"><img src="${ZI("inv_sword_04")}" alt=""><div class="s11 td num nw" style="margin-top:4px">96 yd</div></div>
      <div class="body">
        <div class="s13"><span class="verb">Faire</span><span class="c-quest semi">Terres malades</span></div>
        <div class="obj s13"><span class="t">Ours des chardons enragé capturé</span><span class="t num semi" style="margin-left:auto">0/1</span></div>
        <div class="mob s12">${ic("skull")}<span class="c-mob ell">Ours des chardons enragé</span><span class="r tm num">niv. 13-14</span></div>
        <div class="use s12"><span class="ta">Utiliser</span> <span class="c-item">Espoir de Tharnariun</span> <span class="tm">· bouton à gauche</span></div>
      </div>
    </div>
    <div class="nxt s12">
      <div class="l">${ic("turnin")}<span class="tm">Rendre</span><span class="td ell">Un maître perdu</span></div>
      <div class="l">${ic("turnin")}<span class="tm">Rendre</span><span class="td ell">Terres malades</span></div>
      <div class="l">${ic("turnin")}<span class="tm">Rendre</span><span class="td ell">Les absences du Prospecteur</span></div>
    </div>`;
  return `
    <div class="cur">
      <div class="ico"><img src="${ZI("inv_sword_04")}" alt=""><div class="s11 td num nw" style="margin-top:4px">142 yd</div></div>
      <div class="body">
        <div class="s13"><span class="verb">Faire</span><span class="c-quest semi">La caverne des trolls</span></div>
        <div class="obj s13"><span class="t">Jeune troll Frostmane tué</span><span class="t num semi" style="margin-left:auto">5/14</span></div>
        <div class="obj"><span class="mini" style="max-width:none"><b style="width:36%"></b></span></div>
        <div class="mob s12">${ic("skull")}<span class="c-mob">Jeune troll Frostmane</span><span class="r tm num">niv. 3-4</span></div>
      </div>
    </div>
    <div class="nxt s12">
      <div class="l">${ic("turnin")}<span class="tm">Rendre</span><span class="td ell">La caverne des trolls</span></div>
      <div class="l">${ic("accept")}<span class="tm">Prendre</span><span class="td ell">Le journal volé</span></div>
      <div class="l">${ic("accept")}<span class="tm">Prendre</span><span class="td ell">Une livraison de thé brûlant</span></div>
    </div>`;
}
/* bouton de l'objet de quête, à gauche du suivi (anneau de métal, lueur de l'accent) */
function itemButton() {
  return `<div class="qitem"><span class="emb" style="width:44px;height:44px"><span class="disc"><img src="${ZI("spell_shadow_soulgem")}" alt=""></span><span class="rg"></span></span></div>`;
}
function tracker(t, style, scene = "kill") {
  const sc = SCENES[scene];
  const hard = style === "solid" ? "" : "hard";
  return `
<div class="ui ${hard} trk st-${style}" style="${vars(t)}">
  ${scene === "item" ? itemButton() : ""}
  <div class="bgl"></div>${style === "solid" ? CORNERS : ""}
  ${style === "solid" ? `<div class="tbn">${bandeau(t, 44, `${emb(t, 30)}<div style="flex:1;min-width:0"><div class="hrow"><span class="s15 t">${sc.zone}</span><span class="lv s12 td num">${sc.lv}</span></div><div class="s11 td">${sc.sub}</div></div>`)}</div>` : ""}
  <div class="ui-in">
    ${style === "solid" ? "" : `<div class="hrow"><span class="s15 t">${sc.zone}</span><span class="lv s12 tm num">${sc.lv}</span></div>`}
    <div class="prog"><b style="width:${sc.pct}%"></b></div>
    <div class="meta s11"><span class="td num">${sc.xp}</span><span class="r c-xp num">${sc.rate}</span></div>
    ${trackerBody(scene)}
  </div>
</div>`;
}

/* ------------------------------------------------------------ journal, onglet Route */
const CHAPTERS = [["Coldridge Valley", "1-6", 1], ["Northshire", "1-6"], ["Shadowglen", "1-6"], ["Zephras Isle", "1-15"],
  ["Dun Morogh", "6-11"], ["Elwynn Forest", "6-11"], ["Teldrassil", "6-11"], ["Loch Modan", "11-14"], ["Westfall", "11-16"],
  ["Darkshore", "11-19"], ["Westfall", "14-16"], ["Darkshore", "16-19"], ["Ashenvale and Stonetalon", "20-22"],
  ["Redridge Mountains", "22-26"], ["Wetlands", "26-29"], ["Hillsbrad Foothills", "29-30"]];
const STEPS = [
  ["done", "accept", "Prendre", "Tailleur chez les nains"], ["done", "kill", "", "Tailleur chez les nains"],
  ["done", "turnin", "Rendre", "Tailleur chez les nains"], ["done", "accept", "Prendre", "La distribution du courrier de la Vallée de Frigères"],
  ["done", "accept", "Prendre", "Une nouvelle menace"], ["done", "turnin", "Rendre", "La distribution du courrier de la Vallée de Frigères"],
  ["done", "accept", "Prendre", "Chasseur de sangliers"], ["done", "kill", "", "Chasseur de sangliers"],
  ["done", "turnin", "Rendre", "Chasseur de sangliers"], ["done", "accept", "Prendre", "La caverne des trolls"],
  ["cur", "kill", "", "La caverne des trolls"], ["next", "turnin", "Rendre", "La caverne des trolls"],
  ["next", "accept", "Prendre", "Le journal volé"], ["next", "accept", "Prendre", "Une livraison de thé brûlant"],
  ["next", "turnin", "Rendre", "Une livraison de thé brûlant"], ["next", "accept", "Prendre", "Rapporter la Tasse"],
  ["next", "accept", "Prendre", "Grund and Gozwin"], ["next", "accept", "Prendre", "Les malheurs d'un réfugié"],
  ["next", "kill", "", "Une nouvelle menace"], ["next", "kill", "", "Le journal volé"],
];
function journal(t) {
  const ch = CHAPTERS.map(([n, l, on]) => `<div class="it ${on ? "on" : ""}"><span class="ell">${n}</span><span class="r num">${l}</span></div>`).join("");
  const st = STEPS.map(([s, k, v, n]) => {
    const mark = s === "done" ? ic("done") : s === "cur" ? `<span class="ic ta">${SV.cur}</span>` : "";
    const verb = v ? `<span class="${s === "done" ? "" : "tm"}">${v}</span>` : "";
    return `<div class="l ${s}"><span class="st">${mark}</span>${ic(k)}${verb}<span class="ell">${n}</span></div>`;
  }).join("");
  return `
<div class="ui win" style="${vars(t)};width:740px">${CORNERS}<div class="wm" style="width:230px;height:230px"><img src="${crestSrc(t)}" alt=""></div>
  ${hd(t, "Questify", `<div class="tabs"><span class="tab on">Route</span><span class="tab">Quêtes de classe</span><span class="tab">Donjons</span></div>`)}
  <div style="display:flex;height:470px">
    <div class="side" style="width:210px;padding-top:8px">
      <div class="h3" style="margin:0 12px 6px">Chapitres<span class="r num">16</span></div>${ch}
    </div>
    <div style="flex:1;position:relative;padding:8px 10px 0 4px">
      <div class="h3" style="margin:0 8px 4px">Étapes · Coldridge Valley<span class="r num">11 / 40</span></div>
      <div class="steps">${st}</div>
      <div class="scroll" style="top:34px;bottom:6px"><b style="top:0;height:38%"></b></div>
      <div class="tip" style="left:300px;top:286px">
        <div class="s13 semi c-quest">Le journal volé</div>
        <div class="s12 td" style="margin-top:4px">Prendre la quête auprès de <span class="c-npc">Grelin Whitebeard</span>.</div>
        <div class="s12 tm" style="margin-top:4px">À faire</div>
        <div class="s12 ta" style="margin-top:6px">Clic : en faire l'étape courante</div>
      </div>
    </div>
  </div>
  <div class="ft"><span class="s12 tm">Alliance · Nain · 11 étapes faites sur 40</span><span class="sp" style="flex:1"></span>
    <span class="btn">Recommencer le chapitre</span><span class="btn pri">Options…</span></div>
</div>`;
}

/* ------------------------------------------------------------ options, section Thème */
/* carte de thème : bandeau de la race en fond, portrait dans l'anneau de métal, nom, faction */
function card(key, on, auto) {
  const t = THEMES[key];
  return `<div class="card ${on ? "on" : ""}" style="--metal:${t.metal};--accent2:${t.accent}">
    <div class="band" style="background:url('${banner(t)}') right bottom/auto 80% no-repeat,linear-gradient(180deg,${t.sky},${t.bg})">
      ${emb(t, 30)}<div class="nmw"><div class="nm">${t.name}</div><div class="fc">${t.group === "Neutre" ? "Neutre" : t.group}</div></div>
      ${on ? `<span class="ok">${SV.check}</span>` : ""}${auto ? `<span class="auto">Ma race</span>` : ""}
    </div>
    <div class="acc" style="background:${t.accent}"></div></div>`;
}
function picker(t, keyOn, cols) {
  const a = ["alliance", "human", "dwarf", "nightelf", "gnome", "skyborneA"];
  const h = ["horde", "orc", "troll", "tauren", "undead", "skyborneH"];
  const row = (ks) => ks.map((k) => card(k, k === keyOn, k === "dwarf")).join("");
  return `<div class="cards" style="grid-template-columns:repeat(${cols},1fr)">${card("neutral", keyOn === "neutral")}</div>
  <div class="s11 tm sc2" style="margin:8px 0 4px">Alliance</div>
  <div class="cards" style="grid-template-columns:repeat(${cols},1fr)">${row(a)}</div>
  <div class="s11 tm sc2" style="margin:8px 0 4px">Horde</div>
  <div class="cards" style="grid-template-columns:repeat(${cols},1fr)">${row(h)}</div>`;
}
const ARROW_COLORS = [["Cyan", "#3fd0e6"], ["Thème", null], ["Or", "#f0c75a"], ["Vert", "#5fe08a"], ["Blanc", "#f2f4f7"], ["Rose", "#ff7ab8"]];
function options(t, key) {
  const secs = ["Route", "Navigation", "Automatisation", "Butin", "Classe et donjons", "Carte et repères", "Suivi", "Thème", "Confort", "Outils", "Profils"];
  const side = secs.map((s) => `<div class="it ${s === "Thème" ? "on" : ""}">${s}</div>`).join("");
  const sw = ARROW_COLORS.map(([n, c], i) => `<span class="swc ${i === 0 ? "on" : ""}" title="${n}" style="background:${c || t.accent}">${c ? "" : "T"}</span>`).join("");
  return `
<div class="ui win" style="${vars(t)};width:1000px">${CORNERS}
  ${hd(t, "Options de Questify", `<span class="sp"></span><span class="field" style="width:200px">${SV.search}Chercher une option</span>`)}
  <div style="display:flex;height:640px">
    <div class="side" style="width:150px;padding-top:8px">${side}</div>
    <div style="flex:1;padding:12px 16px;min-width:0">
      <div class="h2">Thème</div>
      <div class="s12 tm" style="margin-top:2px">Couleurs, bandeau et blason de toutes les fenêtres de Questify.</div>
      <div class="h3">Couleurs</div>
      <div class="chk on"><i>${SV.check}</i>Suivre la race du personnage <span class="info">i</span></div>
      <div class="s11 tm" style="margin:3px 0 8px 22px">Nain : le thème Nain (marqué « Ma race ») s'applique tout seul. Choisir un autre thème décoche la case.</div>
      ${picker(t, key, 3)}
      <div class="h3">Flèche flottante</div>
      <div style="display:flex;gap:16px;align-items:center">
        <div class="chk on"><i>${SV.check}</i>Afficher</div>
        <span class="s13 td">Couleur</span><span class="sws">${sw}</span>
      </div>
      <div class="h3">Police, icônes et fond du suivi</div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <span class="seg"><span class="${state.font === "game" ? "on" : ""}">Police du jeu</span><span class="${state.font === "clean" ? "on" : ""}">Lisible</span></span>
        <span class="seg"><span class="${state.icons === "flat" ? "on" : ""}">Icônes plates</span><span class="${state.icons === "game" ? "on" : ""}">Du jeu</span></span>
        <span class="seg"><span class="${state.style === "solid" ? "on" : ""}">Plein</span><span class="${state.style === "fade" ? "on" : ""}">Fondu</span><span class="${state.style === "none" ? "on" : ""}">Sans fond</span></span>
        <span class="s13 td">Opacité</span><div class="slider" style="width:90px"><b style="width:90%"></b><i style="left:83%"></i></div><span class="s12 t num nw">90&nbsp;%</span>
      </div>
    </div>
    <div class="live">
      <div style="display:flex;align-items:center"><span class="s11 tm sc2">Aperçu en direct</span><span class="dotlive"></span></div>
      <div class="seg" style="margin:6px 0 10px;display:flex"><span class="on">Monstres</span><span>Zone</span><span>Objet</span></div>
      <div class="liveworld"><div style="margin-left:22px">${tracker(t, state.style, "kill")}</div></div>
      <div class="liveworld" style="margin-top:8px;display:flex;align-items:center;justify-content:center;height:96px">${arrow("#3fd0e6", "Senir Whitebeard")}</div>
      <div class="s11 tm" style="margin-top:6px">Le vrai suivi, avec ton thème : change d'onglet pour voir une zone à plusieurs quêtes ou un objet à utiliser.</div>
    </div>
  </div>
</div>`;
}

/* ------------------------------------------------------------ assistant, page Apparence */
function wizard(t, key) {
  return `
<div class="ui win" style="${vars(t)};width:560px">${CORNERS}
  ${hd(t, "Assistant de Questify", `<span class="sp"></span><span class="sub">Étape 4 sur 6</span>`)}
  <div style="padding:14px 18px 10px">
    <div class="h2">Choisis ton thème</div>
    <div class="s13 td" style="margin-top:6px;line-height:18px">Ton personnage est <b class="t">Nain</b> : Questify propose le thème Nain. Tu peux garder le thème neutre, prendre celui de ta faction ou celui d'une autre race.</div>
    <div class="chk on" style="margin-top:10px"><i>${SV.check}</i>Suivre la race du personnage</div>
    <div style="margin-top:6px">${picker(t, key, 3)}</div>
    <div class="s12 tm" style="margin-top:10px">Tout se change ensuite dans Options › Thème, ou avec <span class="t">/qf theme</span>.</div>
  </div>
  <div class="ft"><span class="btn">Précédent</span><span style="flex:1"></span><span class="btn ghost">Ignorer</span><span class="btn pri">Suivant</span></div>
</div>`;
}

/* ------------------------------------------------------------ popup (quête de classe) */
function popup(t) {
  return `
<div class="ui win" style="${vars(t)};width:330px">${CORNERS}
  ${bandeau(t, 46, `${emb(t, 30)}<span class="ttl" style="font-size:14px">Quête de classe</span><span class="sp"></span><span class="x">${SV.x}</span>`)}
  <div style="padding:12px 14px;display:flex;gap:10px">
    <img src="https://wow.zamimg.com/images/wow/icons/large/spell_holy_holysmite.jpg" style="width:36px;height:36px;box-shadow:0 0 0 1px var(--edge)" alt="">
    <div>
      <div class="s13 semi c-quest">Le livre de la Lumière</div>
      <div class="s12 td" style="margin-top:4px;line-height:16px">Disponible au niveau 10 à Forgefer, auprès de <span class="c-npc">Maxan Anvol</span>. Récompense : <span class="c-item">Masse de dévotion</span>.</div>
      <div class="s11 tm" style="margin-top:6px">Ajoute un détour d'environ 6 min à la route.</div>
    </div>
  </div>
  <div class="ft"><span class="btn ghost">Plus tard</span><span style="flex:1"></span><span class="btn">Jamais</span><span class="btn pri">Ajouter à la route</span></div>
</div>`;
}

/* ------------------------------------------------------------ flèche flottante */
function arrow(color, label) {
  return `<div class="arrow"><svg viewBox="0 0 100 70" style="filter:drop-shadow(0 0 6px ${color}) drop-shadow(0 2px 2px #000)">
    <g transform="rotate(-28 50 35)"><path d="M10 27h46V12l36 23-36 23V43H10z" fill="${color}" stroke="#ffffffcc" stroke-width="2" stroke-linejoin="round"/>
    <path d="M14 35h70" stroke="#ffffff" stroke-width="1" opacity=".45"/></g></svg>
    <div class="d num">128 yd</div><div class="n">${label}</div></div>`;
}

/* ------------------------------------------------------------ pages */
function render() {
  const t = THEMES[state.theme];
  document.body.classList.toggle("f-clean", state.font === "clean");
  document.body.classList.toggle("i-game", state.icons === "game");
  const page = document.getElementById("page");
  const ratio = contrast(t.text, t.bg).toFixed(1), ratio2 = contrast(t.textDim, t.bg).toFixed(1),
    ratio3 = contrast(t.textMuted, t.bg).toFixed(1);
  const fontName = state.font === "game" ? "police du jeu" : "police lisible (Inter)";
  const styleName = { solid: "fond plein", fade: "fond fondu", none: "sans fond" }[state.style];
  if (state.view === "grid") {
    page.innerHTML = `
<div class="head-cap"><div><div class="brand">Questify · refonte des thèmes</div><h1>Les 13 thèmes, sur le suivi</h1>
  <div class="meta">Vallée de Frigères enneigée en fond (le cas le plus clair). ${fontName}, ${styleName}, opacité 90 %.</div></div></div>
<div class="world"><div class="grid13">${ORDER.map((k) => `<div>${tracker(THEMES[k], state.style)}
  <div class="lab" style="text-shadow:0 1px 2px rgba(0,0,0,.6)">${THEMES[k].name}<small>${THEMES[k].group}${THEMES[k].note ? " · " + THEMES[k].note : ""}</small></div></div>`).join("")}</div></div>`;
    return;
  }
  page.innerHTML = `
<div class="head-cap">
  <div><div class="brand">Questify · refonte des thèmes</div><h1>Thème ${t.name}${t.group !== t.name && t.group !== "Neutre" ? " · " + t.group : ""}</h1>
    <div class="meta">Contraste sur le fond : texte <b>${ratio}:1</b>, secondaire <b>${ratio2}:1</b>, discret <b>${ratio3}:1</b> (minimum visé 7 / 4,5). ${fontName}, icônes ${state.icons === "flat" ? "plates" : "du jeu"}.</div></div>
  <div class="swatches">${["bg", "panel", "panelAlt", "sidebar", "sky", "edge", "accent", "trim"].map((k) => `<span title="${k} ${t[k]}" style="background:${t[k]}"></span>`).join("")}</div>
</div>
<div class="row">
  <div class="cell"><div class="cap"><b>Journal</b> (/qf), onglet Route · zoom 1,45</div><div style="zoom:1.45">${journal(t)}</div></div>
  <div class="cell"><div class="cap"><b>Suivi</b> sur le monde · zoom 1,6</div>
    <div class="world" style="padding:22px"><div style="zoom:1.6">${tracker(t, state.style)}</div></div>
    <div class="cap" style="margin-top:22px"><b>Popup</b> · zoom 1,45</div><div style="zoom:1.45">${popup(t)}</div>
    <div class="cap" style="margin-top:22px"><b>Flèche flottante</b> : cyan, ou couleur du thème · zoom 1,3</div>
    <div class="world" style="padding:16px;display:flex;gap:30px;justify-content:center"><div style="zoom:1.3">${arrow("#3fd0e6", "Senir Whitebeard")}</div><div style="zoom:1.3">${arrow(t.accent, "Senir Whitebeard")}</div></div></div>
</div>
<div class="row">
  <div class="cell"><div class="cap"><b>Options</b>, section Thème, avec l'aperçu en direct · zoom 1,4</div><div style="zoom:1.4">${options(t, state.theme)}</div></div>
</div>
<div class="row">
  <div class="cell"><div class="cap"><b>Les trois onglets de l'aperçu</b> : monstres à tuer, zone à plusieurs quêtes, objet à utiliser · zoom 1,45</div>
    <div class="world" style="padding:22px 22px 22px 40px;display:flex;gap:110px;align-items:flex-start">${["kill", "zone", "item"].map((sc) => `<div style="zoom:1.45">${tracker(t, state.style, sc)}</div>`).join("")}</div></div>
</div>
<div class="row">
  <div class="cell"><div class="cap"><b>Assistant</b>, page Thème · zoom 1,3</div><div style="zoom:1.3">${wizard(t, state.theme)}</div></div>
</div>`;
}

/* ------------------------------------------------------------ barre de choix */
function ctl() {
  const b = (k, v, label) => `<button class="${state[k] === v ? "on" : ""}" data-k="${k}" data-v="${v}">${label}</button>`;
  document.getElementById("ctl").innerHTML = `
  <div class="grp"><span class="lbl">Vue</span>${b("view", "windows", "Fenêtres")}${b("view", "grid", "Les 13 suivis")}</div>
  <div class="grp"><span class="lbl">Thème</span>${ORDER.map((k) => b("theme", k, THEMES[k].name + (k.startsWith("skyborne") ? (k.endsWith("A") ? " (A)" : " (H)") : ""))).join("")}</div>
  <div class="grp"><span class="lbl">Police</span>${b("font", "game", "Du jeu")}${b("font", "clean", "Inter")}</div>
  <div class="grp"><span class="lbl">Icônes</span>${b("icons", "flat", "Plates")}${b("icons", "game", "Du jeu")}</div>
  <div class="grp"><span class="lbl">Fond du suivi</span>${b("style", "solid", "Plein")}${b("style", "fade", "Fondu")}${b("style", "none", "Sans fond")}</div>`;
  document.querySelectorAll("#ctl button").forEach((el) => el.onclick = () => {
    state[el.dataset.k] = el.dataset.v;
    const q = new URLSearchParams(state); history.replaceState(null, "", "?" + q);
    ctl(); render();
  });
}
ctl(); render();
</script>
</body>
</html>
